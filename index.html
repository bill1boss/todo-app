<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page layout configuration -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager & To-Do App</title>
  <!-- Stylesheet reference for application styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main container wrapper for the Task Manager application -->
  <div class="todo-container">
    <h1>📝 Task Manager</h1>

    <!-- Visual Progress Bar displaying task completion status in percentage -->
    <div class="progress-container">
      <div class="progress-status">
        <span>Progress</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
    </div>
    
    <!-- Input Form for creating new tasks -->
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." required autocomplete="off">
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <!-- Filter Buttons for toggling between All, Active, and Completed tasks -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Unordered list element where tasks will be dynamically generated by JS -->
    <ul id="todo-list"></ul>

    <!-- Footer displaying task stats and quick action button -->
    <div class="todo-footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed-btn">Clear Completed</button>
    </div>
  </div>

  <!-- Main script handling state management and LocalStorage -->
  <script src="script.js"></script>
</body>
</html>
