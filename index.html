<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager / To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="todo-container">
    <h1>📝 Task Manager</h1>
    
    <!-- Φόρμα εισαγωγής νέας εργασίας -->
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Πρόσθεσε μια νέα εργασία..." required autocomplete="off">
      <button type="submit" id="add-btn">Προσθήκη</button>
    </form>

    <!-- Λίστα όπου θα μπαίνουν οι εργασίες μέσω JavaScript -->
    <ul id="todo-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
